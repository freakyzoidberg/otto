name: Go

on:
  push:
    branches: ["main", "fix-race"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -short ./...

      - name: Test Race
        run: go test -v -short -race -count=5 ./...
